name: Online4Tech Model-Specific Backup Releases

on:
  push:
    branches: [main]
    paths:
      - model-release-organize.flag
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: online4tech-model-release-organizer
  cancel-in-progress: false

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests
      - name: Build dedicated model releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: online4tech/Online4Tech-Repository
        run: python tools/release-mirror/model_release_organizer.py
