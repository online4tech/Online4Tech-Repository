<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online4Tech | معرض صور البلجنز والاسكينات</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#102039;--line:#233650;--text:#eef5ff;--muted:#9fb0c7;--blue:#39a5ff;--cyan:#55d6e8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#102b49 0,#07111f 55%);color:var(--text);font-family:Tahoma,Arial,sans-serif}
header{padding:30px 5vw 20px;border-bottom:1px solid var(--line)}h1{margin:0 0 8px;font-size:clamp(24px,4vw,36px)}p{color:var(--muted);line-height:1.8}
main{max-width:1250px;margin:auto;padding:24px 5vw 60px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px}
button{border:1px solid var(--line);background:#10223a;color:var(--text);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit}.active{background:#123b61;border-color:var(--blue)}
#status{color:var(--muted);margin:12px 0}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}
.card{background:linear-gradient(160deg,#14263d,#0d192a);border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0}.card h2{font-size:17px;margin:0 0 5px}.meta{font-size:12px;color:var(--muted);margin-bottom:12px}
.images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.images a{display:block}.images img{width:100%;height:118px;object-fit:cover;border:1px solid var(--line);border-radius:9px;background:#081321}
a{color:var(--cyan)}.empty{padding:24px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
</style></head>
<body>
<header><h1>معرض صور البلجنز والاسكينات</h1><p>الصور الأصلية المنقولة من مستودع Online4Tech، مجمعة حسب مجلدها الأصلي. اضغط على أي صورة لفتحها بالحجم الكامل.</p></header>
<main>
<div class="toolbar"><button class="active" data-kind="all">الكل</button><button data-kind="plugin">صور البلجنز</button><button data-kind="skin">صور الاسكينات</button></div>
<div id="status">جاري تحميل الصور...</div><section id="groups" class="groups"></section>
</main>
<script>
const RAW="https://raw.githubusercontent.com/online4tech/Online4Tech-Repository/main/";
const box=document.getElementById("groups"),statusBox=document.getElementById("status");
let all=[],kind="all";
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
function render(){
 box.replaceChildren();
 const rows=all.filter(x=>kind==="all"||x.kind===kind);
 const grouped=new Map();
 rows.forEach(x=>{const dir=x.target_path.split("/").slice(0,-1).join("/");if(!grouped.has(dir))grouped.set(dir,[]);grouped.get(dir).push(x);});
 statusBox.textContent=rows.length+" صورة · "+grouped.size+" مجلد";
 if(!rows.length){box.append(el("div","empty","لا توجد صور في هذا القسم."));return;}
 for(const [dir,items] of grouped){
  const card=el("article","card");card.append(el("h2","",dir.split("/").pop().replace(/-/g," ")));
  card.append(el("div","meta",(dir.includes("/plugins/")?"Plugin":"Skin")+" · "+items.length+" صورة"));
  const grid=el("div","images");
  items.forEach(x=>{const a=el("a");a.href=RAW+x.target_path;a.target="_blank";a.rel="noopener";const im=el("img");im.loading="lazy";im.src=RAW+x.target_path;im.alt=x.source_path;a.append(im);grid.append(a);});
  card.append(grid);box.append(card);
 }
}
fetch("./catalog/source-tree-ipk-import.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json();}).then(j=>{all=j.images||[];render();}).catch(()=>{statusBox.textContent="تعذر تحميل فهرس الصور.";box.append(el("div","empty","حاول تحديث الصفحة بعد قليل."));});
document.querySelectorAll("[data-kind]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-kind]").forEach(x=>x.classList.toggle("active",x===b));kind=b.dataset.kind;render();}));
</script></body></html>
